<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora PK/PD — Vancomicina</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F0F4F8;--surface:#FFFFFF;--surface2:#F7FAFC;
  --border:#D9E2EC;--border2:#BCCCDC;
  --accent:#6B21A8;--accent2:#1A6B4A;
  --warn:#B45309;--danger:#C0392B;--ok:#1A6B4A;
  --text:#1A202C;--muted:#627D98;
  --font:'Syne',sans-serif;--mono:'JetBrains Mono',monospace;
}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;padding:1.5rem 1rem 3rem;}

.header{max-width:1060px;margin:0 auto 1.5rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:1rem 1.25rem;}
.header-left h1{font-size:clamp(14px,2.2vw,20px);font-weight:800;letter-spacing:-0.02em;color:var(--accent);}
.header-sub{font-size:10px;color:var(--muted);margin-top:2px;letter-spacing:0.05em;font-weight:500;}
.header-author{font-size:11px;color:var(--muted);margin-top:3px;font-weight:600;letter-spacing:0.04em;}
.header-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}

.status-pill{font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;padding:5px 14px;border-radius:20px;border:1px solid var(--border2);background:var(--surface2);color:var(--muted);transition:all .3s;}
.status-pill.ok{background:#E6F4EE;border-color:#A8D9C0;color:var(--ok);}
.status-pill.warn{background:#FEF3C7;border-color:#FCD34D;color:var(--warn);}
.status-pill.danger{background:#FAEAEA;border-color:#E8AAAA;color:var(--danger);}

.btn-pdf{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;padding:6px 14px;border-radius:20px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;transition:opacity .2s;}
.btn-pdf:hover{opacity:.85;}
.btn-pdf svg{width:13px;height:13px;}

.wrap{max-width:1060px;margin:0 auto;display:grid;grid-template-columns:290px 1fr;gap:1.25rem;align-items:start;}
@media(max-width:740px){.wrap{grid-template-columns:1fr;}}

.panel{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:1.25rem;}
.panel:last-child{margin-bottom:0;}
.panel-head{padding:.65rem 1rem;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;background:var(--surface2);}
.panel-head-dot{width:7px;height:7px;border-radius:50%;}
.panel-head h2{font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);}
.panel-body{padding:1rem;}

label{display:block;font-size:10px;font-weight:700;letter-spacing:0.09em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;}
input,select{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:var(--mono);font-size:13px;padding:7px 10px;outline:none;transition:border-color .2s;}
input:focus,select:focus{border-color:var(--accent);}
.form-row{margin-bottom:.8rem;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:.65rem;}

.btn-calc{width:100%;margin-top:.4rem;padding:9px;border:none;border-radius:7px;background:var(--accent);color:#fff;font-family:var(--font);font-size:12px;font-weight:700;letter-spacing:0.06em;cursor:pointer;transition:opacity .2s;}
.btn-calc:hover{opacity:.88;}
.btn-reset{width:100%;margin-top:.4rem;padding:7px;border:1px solid var(--border2);border-radius:7px;background:transparent;color:var(--muted);font-family:var(--font);font-size:11px;font-weight:600;cursor:pointer;transition:all .2s;}
.btn-reset:hover{border-color:var(--muted);color:var(--text);}

.metric-grid{display:grid;gap:.65rem;padding:1rem;}
.mg5{grid-template-columns:repeat(5,1fr);}
.mg3{grid-template-columns:repeat(3,1fr);}
.mg2{grid-template-columns:repeat(2,1fr);}
@media(max-width:740px){.mg5,.mg3{grid-template-columns:repeat(2,1fr);}.mg2{grid-template-columns:1fr 1fr;}}
.metric{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:.7rem .85rem;}
.metric-label{font-size:9px;font-weight:700;letter-spacing:0.09em;text-transform:uppercase;color:var(--muted);margin-bottom:3px;line-height:1.4;}
.metric-value{font-family:var(--mono);font-size:17px;font-weight:500;color:var(--text);}
.metric-value small{font-size:10px;color:var(--muted);margin-left:2px;}
.metric.c-accent .metric-value{color:var(--accent);}
.metric.c-green .metric-value{color:var(--ok);}
.metric.c-warn .metric-value{color:var(--warn);}
.metric.c-blue .metric-value{color:#0369A1;}

.result-box{margin:0 1rem 1rem;padding:.9rem 1rem;border-radius:8px;border:1px solid var(--border);background:var(--surface2);}
.result-box.ok{border-color:#A8D9C0;background:#E6F4EE;}
.result-box.warn{border-color:#FCD34D;background:#FEF3C7;}
.result-box.danger{border-color:#E8AAAA;background:#FAEAEA;}
.result-title{font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:4px;color:var(--muted);}
.result-title.ok{color:var(--ok);}
.result-title.warn{color:var(--warn);}
.result-title.danger{color:var(--danger);}
.result-body{font-size:13px;line-height:1.6;color:var(--text);}

.section-label{padding:.55rem 1rem .25rem;font-size:9px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);border-top:1px solid var(--border);}

.mic-badge{display:inline-block;margin-top:5px;padding:3px 10px;border-radius:12px;font-size:10px;font-weight:700;letter-spacing:0.05em;}
.mic-badge.s{background:#E6F4EE;color:var(--ok);border:1px solid #A8D9C0;}
.mic-badge.r{background:#FAEAEA;color:var(--danger);border:1px solid #E8AAAA;}

.chart-btn{margin:0 1rem 1rem;padding:8px;border:1px dashed var(--border2);border-radius:8px;background:transparent;color:var(--muted);font-family:var(--font);font-size:11
