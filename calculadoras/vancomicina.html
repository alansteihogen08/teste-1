<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora PK/PD — Vancomicina</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F0F4F8;--surface:#FFFFFF;--surface2:#F7FAFC;
  --border:#D9E2EC;--border2:#BCCCDC;
  --accent:#6B21A8;--accent2:#1A6B4A;
  --warn:#B45309;--danger:#C0392B;--ok:#1A6B4A;
  --text:#1A202C;--muted:#627D98;
  --font:'Syne',sans-serif;--mono:'JetBrains Mono',monospace;
}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;padding:1.5rem 1rem 3rem;}
.header{max-width:1060px;margin:0 auto 1.5rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:1rem 1.25rem;}
.header-left h1{font-size:clamp(14px,2.2vw,20px);font-weight:800;letter-spacing:-0.02em;color:var(--accent);}
.header-sub{font-size:10px;color:var(--muted);margin-top:2px;letter-spacing:0.05em;font-weight:500;}
.header-author{font-size:11px;color:var(--muted);margin-top:3px;font-weight:600;letter-spacing:0.04em;}
.header-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.status-pill{font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;padding:5px 14px;border-radius:20px;border:1px solid var(--border2);background:var(--surface2);color:var(--muted);transition:all .3s;}
.status-pill.ok{background:#E6F4EE;border-color:#A8D9C0;color:var(--ok);}
.status-pill.danger{background:#FAEAEA;border-color:#E8AAAA;color:var(--danger);}
.btn-pdf{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;padding:6px 14px;border-radius:20px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;transition:opacity .2s;}
.wrap{max-width:1060px;margin:0 auto;display:grid;grid-template-columns:290px 1fr;gap:1.25rem;align-items:start;}
@media(max-width:740px){.wrap{grid-template-columns:1fr;}}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:1.25rem;}
.panel-head{padding:.65rem 1rem;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;background:var(--surface2);}
.panel-head-dot{width:7px;height:7px;border-radius:50%;}
.panel-head h2{font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);}
.panel-body{padding:1rem;}
label{display:block;font-size:10px;font-weight:700;letter-spacing:0.09em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;}
input,select{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:var(--mono);font-size:13px;padding:7px 10px;outline:none;}
.form-row{margin-bottom:.8rem;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:.65rem;}
.btn-calc{width:100%;margin-top:.4rem;padding:9px;border:none;border-radius:7px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer;}
.metric-grid{display:grid;gap:.65rem;padding:1rem;}
.mg5{grid-template-columns:repeat(5,1fr);}
.mg2{grid-template-columns:1fr 1fr;}
.metric{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:.7rem .85rem;}
.metric-label{font-size:9px;font-weight:700;text-transform:uppercase;color:var(--muted);margin-bottom:3px;}
.metric-value{font-family:var(--mono);font-size:17px;font-weight:500;}
.result-box{margin:0 1rem 1rem;padding:.9rem 1rem;border-radius:8px;border:1px solid var(--border);background:var(--surface2);}
.result-box.ok{border-color:#A8D9C0;background:#E6F4EE;}
.result-box.danger{border-color:#E8AAAA;background:#FAEAEA;}
.chart-wrap{display:none;margin:0 1rem 1rem;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:1rem;}
.chart-wrap.open{display:block;}
.info-box{margin:1rem;padding:.8rem 1rem;border-radius:8px;border:1px solid #C4B5FD;background:#F5F3FF;font-size:11.5px;line-height:1.7;color:#5B21B6;}
</style>
</head>
<body>
<div class="header">
  <div class="header-left">
    <h1>Calculadora PK/PD — Vancomicina</h1>
    <div class="header-sub">Modelo Matzke · Alvo AUC₂₄/MIC 400–600</div>
    <div class="header-author">Desenvolvido por Alan Steihogen</div>
  </div>
  <div class="header-right">
    <div id="status-pill" class="status-pill">Aguardando dados</div>
    <button class="btn-pdf" onclick="window.print()">Gerar PDF</button>
  </div>
</div>
<div class="wrap">
<div>
  <div class="panel">
    <div class="panel-head"><div class="panel-head-dot" style="background:var(--accent)"></div><h2>Paciente</h2></div>
    <div class="panel-body">
      <div class="form-grid">
        <div class="form-row"><label>Sexo</label><select id="sexo"><option value="M">M</option><option value="F">F</option></select></div>
        <div class="form-row"><label>Idade</label><input type="number" id="idade"></div>
      </div>
      <div class="form-grid">
        <div class="form-row"><label>Peso (kg)</label><input type="number" id="peso"></div>
        <div class="form-row"><label>Creatinina</label><input type="number" step="0.01" id="creat"></div>
      </div>
      <div class="form-row"><label>MIC (mg/L)</label><select id="mic"><option value="0.5">0.5</option><option value="1" selected>1.0</option><option value="2">2.0</option></select></div>
    </div>
  </div>
  <div class="panel">
    <div class="panel-head"><div class="panel-head-dot" style="background:var(--accent2)"></div><h2>Dose</h2></div>
    <div class="panel-body">
      <div class="form-row"><label>Dose (mg)</label><input type="number" id="dose" value="1000"></div>
      <div class="form-grid">
        <div class="form-row"><label>Intervalo (h)</label><input type="number" id="tau" value="12"></div>
        <div class="form-row"><label>Infusão (h)</label><input type="number" id="tinf" value="1"></div>
      </div>
      <button class="btn-calc" onclick="calcular()">Calcular</button>
    </div>
  </div>
</div>
<div>
  <div class="panel">
    <div class="panel-head"><h2>Resultados PK</h2></div>
    <div class="metric-grid mg5">
      <div class="metric"><div class="metric-label">Vd</div><div class="metric-value" id="m-vd">-</div></div>
      <div class="metric"><div class="metric-label">ClV</div><div class="metric-value" id="m-clv">-</div></div>
      <div class="metric"><div class="metric-label">Ke</div><div class="metric-value" id="m-ke">-</div></div>
      <div class="metric"><div class="metric-label">T1/2</div><div class="metric-value" id="m-t12">-</div></div>
      <div class="metric"><div class="metric-label">AUC24</div><div class="metric-value" id="m-auc">-</div></div>
    </div>
  </div>
  <div class="result-box" id="box-auc">
    <div id="txt-auc">Introduza os dados e clique em Calcular.</div>
  </div>
  <div class="chart-wrap" id="chart-wrap"><canvas id="decay-chart"></canvas></div>
</div>
</div><script>
let chartInstance = null;
let lastChart = null;

function calcular() {
  const sexo = document.getElementById('sexo').value;
  const idade = parseFloat(document.getElementById('idade').value);
  const peso = parseFloat(document.getElementById('peso').value);
  const creat = parseFloat(document.getElementById('creat').value);
  const mic = parseFloat(document.getElementById('mic').value);
  const dose = parseFloat(document.getElementById('dose').value);
  const tau = parseFloat(document.getElementById('tau').value);
  const tinf = parseFloat(document.getElementById('tinf').value);

  if (!idade || !peso || !creat || !dose) {
    alert("Por favor, preencha todos os campos obrigatórios.");
    return;
  }

  // ClCr Cockcroft-Gault
  let clcr = ((140 - idade) * peso) / (72 * creat);
  if (sexo === 'F') clcr *= 0.85;

  // Parâmetros PK Matzke
  const vd = 0.7 * peso;
  const clVanco = clcr * 0.06; // L/h
  const ke = clVanco / vd;
  const t12 = Math.log(2) / ke;

  // Cálculos de AUC e Concentrações
  const auc24 = (dose * (24 / tau)) / clVanco;
  const ratio = auc24 / mic;

  // Atualizar UI
  document.getElementById('m-vd').innerText = vd.toFixed(1);
  document.getElementById('m-clv').innerText = clVanco.toFixed(2);
  document.getElementById('m-ke').innerText = ke.toFixed(4);
  document.getElementById('m-t12').innerText = t12.toFixed(1);
  document.getElementById('m-auc').innerText = Math.round(auc24);

  const box = document.getElementById('box-auc');
  const txt = document.getElementById('txt-auc');
  const pill = document.getElementById('status-pill');

  if (ratio < 400) {
    box.className = 'result-box danger';
    txt.innerHTML = `<strong>AUC/MIC: ${ratio.toFixed(1)}</strong> — Subterapêutico. Alvo: 400-600.`;
    pill.className = 'status-pill danger'; pill.innerText = 'Subterapêutico';
  } else if (ratio > 600) {
    box.className = 'result-box danger';
    txt.innerHTML = `<strong>AUC/MIC: ${ratio.toFixed(1)}</strong> — Risco de Toxicidade. Alvo: 400-600.`;
    pill.className = 'status-pill danger'; pill.innerText = 'Tóxico';
  } else {
    box.className = 'result-box ok';
    txt.innerHTML = `<strong>AUC/MIC: ${ratio.toFixed(1)}</strong> — No Alvo Terapêutico.`;
    pill.className = 'status-pill ok'; pill.innerText = 'No Alvo';
  }

  lastChart = { dose, tau, vd, ke, tinf };
  document.getElementById('chart-wrap').classList.add('open');
  drawChart(lastChart);
}

function drawChart(p) {
  const ctx = document.getElementById('decay-chart').getContext('2d');
  if (chartInstance) chartInstance.destroy();

  const labels = [];
  const data = [];
  const steps = 24;
  
  for (let i = 0; i <= steps; i++) {
    let t = (p.tau / steps) * i;
    let conc;
    const cmaxSS = (p.dose * (1 - Math.exp(-p.ke * p.tinf))) / (p.tinf * p.vd * p.ke * (1 - Math.exp(-p.ke * p.tau)));
    
    if (t <= p.tinf) {
      conc = (p.dose * (1 - Math.exp(-p.ke * t))) / (p.tinf * p.vd * p.ke * (1 - Math.exp(-p.ke * p.tau)));
    } else {
      conc = cmaxSS * Math.exp(-p.ke * (t - p.tinf));
    }
    labels.push(t.toFixed(1) + 'h');
    data.push(conc.toFixed(2));
  }

  chartInstance = new Chart(ctx, {
    type: 'line',
    data: {
      labels: labels,
      datasets: [{
        label: 'Concentração (mg/L)',
        data: data,
        borderColor: '#6B21A8',
        backgroundColor: 'rgba(107, 33, 168, 0.1)',
        fill: true,
        tension: 0.3
      }]
    },
    options: {
      responsive: true,
      scales: { y: { beginAtZero: true } }
    }
  });
}
</script>
</body>
</html>
